<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Labels</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    @page {
      size: 8.5in 11in;
      margin: 0;
    }

    body {
      background: white;
    }

    .sheet {
      width: 8.5in;
      height: 11in;
      padding: 0.5in 0.1875in;
      display: grid;
      /* 9 label cols with 0.125in gutters between groups of 3 */
      grid-template-columns: repeat(3, 1fr) 0.125in repeat(3, 1fr) 0.125in repeat(3, 1fr);
      grid-template-rows: repeat(10, 1fr);
      break-after: page;
    }

    .label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .label img {
      width: 72%;
      height: auto;
      display: block;
    }

    .text {
      font-family: Arial, sans-serif;
      font-size: 10.5pt;
      font-weight: bold;
      letter-spacing: 1px;
      margin-top: 1px;
    }

    @media screen {
      body { background: #e0e0e0; padding: 0.5in; display: flex; flex-direction: column; gap: 0.5in; align-items: flex-start; }
      .sheet { box-shadow: 0 0 8px rgba(0,0,0,0.3); }
      .label { border: 1px solid #ddd; }
    }
  </style>
</head>
<body>
  <script>
    const firstChars = ['Q', 'R', 'S', 'T', ];
    const secondChars = Array.from({length: 26}, (_, i) => String.fromCharCode(65 + i));
    const codes = [];
    for (const f of firstChars)
      for (const s of secondChars)
        codes.push(f + s);

    const LABELS_PER_SHEET = 90; // 9 cols × 10 rows

    function renderSheet(slice) {
      const sheet = document.createElement('div');
      sheet.className = 'sheet';
      let idx = 0;
      for (let row = 0; row < 10; row++) {
        for (let group = 0; group < 3; group++) {
          for (let col = 0; col < 3; col++) {
            const cell = document.createElement('div');
            cell.className = 'label';
            if (idx < slice.length) {
              const code = slice[idx];
              const qr = qrcode(1, 'L');
              qr.addData(code);
              qr.make();
              cell.innerHTML = qr.createImgTag(4, 0);
              const text = document.createElement('div');
              text.className = 'text';
              text.textContent = code;
              cell.appendChild(text);
            }
            idx++;
            sheet.appendChild(cell);
          }
          // gutter column between groups 0→1 and 1→2
          if (group < 2) sheet.appendChild(document.createElement('div'));
        }
      }
      return sheet;
    }

    for (let i = 0; i < codes.length; i += LABELS_PER_SHEET)
      document.body.appendChild(renderSheet(codes.slice(i, i + LABELS_PER_SHEET)));
  </script>
</body>
</html>
